{% extends "base.html" %}

{% block title %}
Tambah Orang
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card shadow border-0">

            <div class="card-header bg-white">

                <h4 class="mb-0">

                    <i class="bi bi-person-plus-fill"></i>
                    Tambah Orang

                </h4>

            </div>

            <div class="card-body">

                <form
                    action="/people/store"
                    method="POST">

                    <div class="mb-4">

                        <label class="form-label">

                            Nama Orang

                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Masukkan nama orang"
                            required>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success">

                            <i class="bi bi-save-fill"></i>
                            Simpan

                        </button>

                        <a
                            href="/people"
                            class="btn btn-secondary">

                            <i class="bi bi-arrow-left"></i>
                            Kembali

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
