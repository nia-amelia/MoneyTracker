<!DOCTYPE html>
<html>
<head>
    <title>Edit Orang</title>
</head>
<body>

<h1>Edit Orang</h1>

<form
    action="/people/update/{{ person[0] }}"
    method="POST"
>

    <label>Nama</label>

    <br><br>

    <input
        type="text"
        name="name"
        value="{{ person[1] }}"
        required
    >

    <br><br>

    <button type="submit">
        Update
    </button>

</form>

</body>
</html>
