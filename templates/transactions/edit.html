{% extends "base.html" %}

{% block title %}
Edit Transaksi
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow border-0">

            <div class="card-header bg-white">

                <h4 class="mb-0">

                    <i class="bi bi-pencil-square"></i>
                    Edit Transaksi

                </h4>

            </div>

            <div class="card-body">

                <form
                    action="/transactions/update/{{ transaction[0] }}"
                    method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Orang

                        </label>

                        <select
                            name="person_id"
                            class="form-select"
                            required>

                            {% for person in people %}

                            <option
                                value="{{ person[0] }}"
                                {% if person[0] == transaction[1] %}
                                selected
                                {% endif %}
                            >

                                {{ person[1] }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Tanggal

                        </label>

                        <input
                            type="date"
                            name="transaction_date"
                            class="form-control"
                            value="{{ transaction[2] }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Jenis Transaksi

                        </label>

                        <select
                            name="type"
                            class="form-select"
                            required>

                            <option
                                value="masuk"
                                {% if transaction[3] == 'masuk' %}
                                selected
                                {% endif %}
                            >

                                Uang Masuk

                            </option>

                            <option
                                value="keluar"
                                {% if transaction[3] == 'keluar' %}
                                selected
                                {% endif %}
                            >

                                Uang Keluar

                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Kategori

                        </label>

                        <input
                            type="text"
                            name="category"
                            class="form-control"
                            value="{{ transaction[4] }}">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Nominal

                        </label>

                        <input
                            type="number"
                            name="amount"
                            class="form-control"
                            value="{{ transaction[5] }}"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Keterangan

                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4">{{ transaction[6] }}</textarea>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary">

                            <i class="bi bi-save-fill"></i>
                            Update

                        </button>

                        <a
                            href="/transactions"
                            class="btn btn-secondary">

                            <i class="bi bi-arrow-left"></i>
                            Kembali

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
