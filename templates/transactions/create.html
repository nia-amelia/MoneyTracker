{% extends "base.html" %}

{% block title %}
Tambah Transaksi
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow border-0">

            <div class="card-header bg-white">

                <h4 class="mb-0">

                    <i class="bi bi-plus-circle-fill"></i>
                    Tambah Transaksi

                </h4>

            </div>

            <div class="card-body">

                <form action="/transactions/store" method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Orang

                        </label>

                        <select
                            name="person_id"
                            class="form-select"
                            required>

                            {% for person in people %}

                            <option value="{{ person[0] }}">

                                {{ person[1] }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Tanggal

                        </label>

                        <input
                            type="date"
                            name="transaction_date"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Jenis Transaksi

                        </label>

                        <select
                            name="type"
                            class="form-select"
                            required>

                            <option value="masuk">

                                Uang Masuk

                            </option>

                            <option value="keluar">

                                Uang Keluar

                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Kategori

                        </label>

                        <input
                            type="text"
                            name="category"
                            class="form-control"
                            placeholder="Contoh: Makan, Transportasi, Tabungan">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Nominal

                        </label>

                        <input
                            type="number"
                            name="amount"
                            class="form-control"
                            placeholder="Masukkan nominal"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Keterangan

                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="4"
                            placeholder="Keterangan transaksi (opsional)"></textarea>

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success">

                            <i class="bi bi-save-fill"></i>
                            Simpan

                        </button>

                        <a
                            href="/transactions"
                            class="btn btn-secondary">

                            <i class="bi bi-arrow-left"></i>
                            Kembali

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
