{% extends "base.html" %}

{% block title %}
Tambah Transaksi
{% endblock %}

{% block content %}

<div class="card card-shadow">

    <div class="card-header">

        <h4>Tambah Transaksi</h4>

    </div>

    <div class="card-body">

        <form action="/transactions/store" method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Orang
                </label>

                <select
                    name="person_id"
                    class="form-select">

                    {% for person in people %}

                    <option value="{{ person[0] }}">
                        {{ person[1] }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Tanggal
                </label>

                <input
                    type="date"
                    name="transaction_date"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Jenis
                </label>

                <select
                    name="type"
                    class="form-select">

                    <option value="masuk">
                        Masuk
                    </option>

                    <option value="keluar">
                        Keluar
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Kategori
                </label>

                <input
                    type="text"
                    name="category"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Nominal
                </label>

                <input
                    type="number"
                    name="amount"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Keterangan
                </label>

                <textarea
                    name="description"
                    class="form-control">
                </textarea>

            </div>

            <button
                type="submit"
                class="btn btn-success">

                Simpan

            </button>

        </form>

    </div>

</div>

{% endblock %}
